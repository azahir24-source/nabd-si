# Local development only. Production scheduling and services are described in DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nabdsi
      POSTGRES_USER: nabdsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabdsi -d nabdsi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      APP_ROLE: web
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgresql://nabdsi:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/nabdsi
      DATABASE_SSLMODE: disable
      OPENAI_API_KEY: ""
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_demo &&
      gunicorn config.wsgi:application --bind=0.0.0.0:8000 --workers=2 --threads=2 --timeout=30
      --access-logfile=- --access-logformat='%(h)s %(t)s %(m)s %(U)s %(s)s %(L)s' --error-logfile=-"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Manual local job; no web/Cognito secrets are passed, and the AI key is worker-only.
  ingest-once:
    build: .
    profiles: ["ingestion"]
    environment:
      APP_ENV: development
      APP_ROLE: ingestion
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgresql://nabdsi:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/nabdsi
      DATABASE_SSLMODE: disable
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INGEST_WORKERS: ${INGEST_WORKERS:-4}
      INGEST_LIMIT_PER_SOURCE: ${INGEST_LIMIT_PER_SOURCE:-10}
    command: ["python", "manage.py", "ingest_news"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
